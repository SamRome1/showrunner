name: ci
on:
  push:
    branches: [main]
  pull_request:
jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run setup
      - run: npm run lint
      - run: npx remotion browser ensure
      - name: Render one still per scene
        run: node scripts/stills.mjs ShortForm 60 305 620 840 1005 1255 1455 1590 1825 2250 2415 2640
      - uses: actions/upload-artifact@v4
        with:
          name: stills
          path: out/stills
